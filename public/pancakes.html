<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVAR’s Pancake Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2a201a;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#fff7ea;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(20,10,5,.35) 100%)}
  .glass{background:rgba(40,28,20,.58);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,235,205,.14)}
  header{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:14px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  header .title{text-shadow:0 1px 8px rgba(0,0,0,.45)}
  header .tools{display:flex;gap:1px;pointer-events:auto;border-radius:18px;padding:3px}
  header .tools button{min-width:44px;padding:6px 3px;font-size:10.5px}
  header .tools .i{font-size:18px;height:18px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;margin:0;letter-spacing:.2px}
  #status{font-size:12.5px;opacity:.9;display:block;margin-top:1px}
  #dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);text-align:center;pointer-events:none}
  #tabs{display:inline-flex;gap:2px;padding:3px;border-radius:16px;margin-bottom:6px;pointer-events:auto}
  #tabs button{flex-direction:row;gap:5px;font-size:13px;font-weight:500;padding:6px 12px;min-width:0;border-radius:13px}
  #barwrap{overflow-x:auto;scrollbar-width:none;padding:0 8px;-webkit-overflow-scrolling:touch;pointer-events:auto}
  #barwrap::-webkit-scrollbar{display:none}
  .bar{display:inline-flex;gap:2px;padding:5px;border-radius:22px;text-align:left;white-space:nowrap}
  .bar[hidden]{display:none}
  button{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:16px;min-width:56px;white-space:nowrap;cursor:pointer;transition:background .2s,opacity .2s}
  button .i{font-size:22px;line-height:1;height:22px}
  button:active{background:rgba(255,235,205,.16)}
  button.on{background:rgba(255,196,110,.24)}
  button:disabled{opacity:.3;cursor:default}
  #ticket{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:12px;width:196px;background:#fffaf0;color:#3b2a1e;border-radius:10px;padding:10px 12px 12px;box-shadow:0 8px 24px rgba(30,15,5,.35);font-size:12.5px;transform:rotate(-1.2deg);transition:transform .35s,opacity .35s}
  #ticket::before{content:'';position:absolute;left:0;right:0;top:-6px;height:8px;background:radial-gradient(circle at 5px 0,transparent 5px,#fffaf0 5.5px) repeat-x;background-size:10px 8px}
  #ticket.away{transform:translateX(-120%) rotate(-8deg);opacity:0}
  #ticket[hidden]{display:none}
  .tk-head{display:flex;gap:8px;align-items:center;border-bottom:1.5px dashed #e3d3bd;padding-bottom:7px;margin-bottom:6px}
  .tk-head .av{font-size:30px;line-height:1}
  .tk-head b{display:block;font-family:'Fraunces',Georgia,serif;font-size:14.5px}
  .tk-head small{color:#9a8068;font-size:11px}
  #tkList{list-style:none;margin:0;padding:0}
  #tkList li{display:flex;align-items:center;gap:6px;padding:2.5px 0}
  #tkList li .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid #cdb79c;display:grid;place-items:center;font-size:10px;flex:none}
  #tkList li.ok .ck{background:#4caf7a;border-color:#4caf7a;color:#fff}
  #tkList li.ok span.t{color:#3d7a54}
  #tkExtra{color:#c0533a;font-size:11px;margin-top:4px;min-height:0}
  #bServe{width:100%;flex-direction:row;justify-content:center;margin-top:8px;background:#f08a3c;color:#fff;font-weight:600;font-size:13.5px;padding:8px;border-radius:999px;box-shadow:0 3px 0 #c8672a}
  #bServe:active{transform:translateY(2px);box-shadow:0 1px 0 #c8672a}
  #bin{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 124px);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;touch-action:none;cursor:grab;transition:transform .3s cubic-bezier(.3,1.4,.5,1);z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #bin.drag{transition:none;cursor:grabbing}
  #bin.hot{background:rgba(200,50,40,.75)}
  #binTag{position:fixed;z-index:4;pointer-events:none;background:#fff;color:#3b2a1e;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;transform:translate(-50%,-100%);box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap}
  #binTag[hidden]{display:none}
  #toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);background:#fffaf0;color:#3b2a1e;padding:12px 18px;border-radius:16px;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;max-width:80vw;z-index:6}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(30,18,10,.45);z-index:8;padding:20px}
  #modal[hidden]{display:none}
  #modal .card{background:#fffaf0;color:#3b2a1e;border-radius:20px;padding:22px 22px 18px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
  #modal h2{font-family:'Fraunces',Georgia,serif;font-size:22px;margin:0 0 8px}
  #modal p{margin:0 0 6px;font-size:14px;line-height:1.45;color:#6a5444}
  #modal .big{font-size:42px;line-height:1.1;margin-bottom:6px}
  #modal .row{display:flex;gap:10px;margin-top:14px}
  #modal .row button{flex:1;flex-direction:row;justify-content:center;font-size:15px;font-weight:600;padding:11px;border-radius:999px;background:#efe3d2;color:#3b2a1e}
  #modal .row button.primary{background:#f08a3c;color:#fff}
  #modal .row button.danger{background:#d9483b;color:#fff}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#2a201a;font-family:'Fraunces',Georgia,serif;font-size:18px;transition:opacity .7s;z-index:9}
  .pat{height:6px;border-radius:999px;background:#efe3d2;overflow:hidden;margin:2px 0 6px}
  #tkPatFill{height:100%;width:100%;background:#4caf7a;border-radius:999px;transition:background .5s}
  .pat[hidden]{display:none}
  #tkList li i{font-style:normal;color:#c0533a;font-weight:600}
  #cookHud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 122px);width:236px;border-radius:18px;padding:10px 12px;text-align:center;z-index:2}
  #cookHud[hidden]{display:none}
  #chLabel{font-size:12px;opacity:.9;margin-bottom:6px}
  .meter{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,#f6e6c0,#e2b263 45%,#a8642a 75%,#3a2216);margin:0 2px 8px}
  .meter .zone{position:absolute;top:-3px;bottom:-3px;border:2px solid #7fe0a2;border-radius:6px;background:rgba(127,224,162,.25)}
  .meter .needle{position:absolute;top:-6px;width:4px;height:24px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(0,0,0,.5);left:0}
  #bFlip{width:100%;flex-direction:row;justify-content:center;background:#f08a3c;color:#fff;font-weight:600;font-size:15px;padding:9px;border-radius:999px}
  #ghost{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-50%) scale(1.6);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
  #ghost[hidden]{display:none}
  #ghost .i{font-size:26px}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:7}
  #flash.on{opacity:.85;transition:none}
  button.ready{position:relative;background:rgba(127,224,162,.16)}

  button.locked{opacity:.5;position:relative}
  button.locked::after{content:'🔒';position:absolute;top:1px;right:3px;font-size:10px}

  .tag{font-size:12px;color:#3d8a5c;font-weight:600}
  .helpbox{max-height:56vh;overflow-y:auto;text-align:left;margin:6px 0;padding-right:4px;-webkit-overflow-scrolling:touch}
  .helpbox h3{margin:14px 0 4px;font-size:15px;font-family:'Fraunces',Georgia,serif;color:#3b2a1e}
  .helpbox h3:first-child{margin-top:4px}
  .helpbox ul{margin:0;padding-left:18px}
  .helpbox li{font-size:13.5px;line-height:1.45;color:#5a4636;margin:3px 0}
  .linkbtn{display:flex;justify-content:center;align-items:center;gap:6px;flex:1;text-decoration:none;font-size:15px;font-weight:600;padding:11px;border-radius:999px;background:#f08a3c;color:#fff}
  #pourTag{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 126px);background:#fffaf0;color:#3b2a1e;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:3;white-space:nowrap;pointer-events:none}

  .stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:54vh;overflow-y:auto;margin:8px 0;padding:6px 4px;-webkit-overflow-scrolling:touch}
  .st{background:#f1e6d6;border-radius:14px;padding:8px 4px 7px;text-align:center}
  .st .e{display:block;font-size:32px;line-height:1.2;filter:grayscale(1);opacity:.22}
  .st.got{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14);transform:rotate(var(--r))}
  .st.got .e{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.25));opacity:1}
  .st b{display:block;font-size:11.5px;color:#3b2a1e;margin-top:2px}
  .st small{display:block;font-size:10px;color:#9a8068;line-height:1.25;margin-top:2px}
  .seg.wrap{flex-wrap:wrap;border-radius:18px}
  .seg.wrap button{flex:0 0 auto;min-width:40px;padding:7px 9px}
  button[hidden]{display:none}
  button.party{background:rgba(255,120,180,.18);position:relative}
  button.party::after{content:'🎉';position:absolute;top:1px;right:3px;font-size:10px}
  .worldbtn{flex-direction:row;justify-content:center;gap:5px;margin:2px auto 6px;background:#efe3d2;color:#3b2a1e;font-size:13px;padding:7px 14px;border-radius:999px}
  .worldbtn span{color:#9a8068}
  .worlds{max-height:46vh;overflow-y:auto;text-align:left;margin:8px 0;-webkit-overflow-scrolling:touch}
  .wc{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:14px;cursor:pointer;border:2px solid transparent;margin-bottom:4px}
  .wc.cur{border-color:#f08a3c;background:#fff1e0}
  .wc .sw{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .wi{flex:1;min-width:0}
  .wi b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wi small{font-size:12px}
  .wc button{min-width:0;padding:6px;font-size:17px}
  #modal input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1.5px solid #e3d3bd;background:#fff;color:#3b2a1e;margin:8px 0 2px;-webkit-user-select:text;user-select:text;outline:none}
  #modal input:focus{border-color:#f08a3c}
  .themes{display:flex;gap:10px;justify-content:center;margin:8px 0}
  .themes button{width:42px;height:42px;min-width:0;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1.5px #e3d3bd}
  .themes button.sel{box-shadow:0 0 0 3px #f08a3c}
  @media (max-width:430px){h1{font-size:16px;max-width:38vw;line-height:1.15}#status{font-size:11.5px;max-width:42vw}header .tools button{min-width:35px;padding:7px 2px}header .tools .t{display:none}header .tools .i{font-size:19px;height:20px}#ticket{width:170px;font-size:12px;padding:9px 10px 11px}.tk-head .av{font-size:26px}}
</style>

<body>
<div id="vignette"></div>
<header>
  <div class="title"><h1>NOVAR’s Pancake Factory</h1><span id="status"></span></div>
  <div class="tools glass">
    <button id="bMusic" class="on"><span class="i">🎵</span><span class="t">Music</span></button>
    <button id="bPhoto"><span class="i">📸</span><span class="t">Photo</span></button>
    <button id="bClear"><span class="i">↺</span><span class="t">Clear</span></button>

  <svg viewBox="0 0 40 40" width="34" height="34"><rect x="16" y="3.5" width="8" height="4" rx="1.6" fill="#2f8452"/><rect x="7" y="7" width="26" height="5" rx="2.2" fill="#2f8452"/><path d="M9.5 13h21l-1.8 21.5a2.5 2.5 0 0 1-2.5 2.3H13.8a2.5 2.5 0 0 1-2.5-2.3z" fill="#47ad70"/><text x="20" y="30.5" text-anchor="middle" font-size="14" fill="#fff" font-family="system-ui">♻</text></svg>
</div>
<div id="binTag" hidden></div>
<div id="dock">
  <div id="tabs" class="glass"><button class="tab on" data-tab="pancakes">🥞 Pancakes</button><button class="tab" data-tab="syrups">🍯 Syrups</button><button class="tab" data-tab="toppings">🍓 Toppings</button></div>

      <button data-syrup="maple"><svg class="i" width="22" height="22" viewBox="0 0 22 22"><path d="M11 2C11 2 4.5 10 4.5 14a6.5 6.5 0 0 0 13 0C17.5 10 11 2 11 2z" fill="#b85a16"/><ellipse cx="8.6" cy="13" rx="1.5" ry="2.4" fill="#fff" opacity=".45"/></svg>Maple</button>

      <button data-syrup="blusyrup"><svg class="i" width="22" height="22" viewBox="0 0 22 22"><path d="M11 2C11 2 4.5 10 4.5 14a6.5 6.5 0 0 0 13 0C17.5 10 11 2 11 2z" fill="#5a2a86"/><ellipse cx="8.6" cy="13" rx="1.5" ry="2.4" fill="#fff" opacity=".45"/></svg>Blueberry syrup</button>

      <button id="bButter"><span class="i">🧈</span>Butter</button>
      <button id="bChoc"><span class="i">🍫</span>Chocolate</button>
      <button id="bCaramel"><span class="i">🍮</span>Caramel</button>
      <button id="bCream"><span class="i">🍦</span>Cream</button>
      <button id="bBerries"><span class="i">🫐</span>Blueberry</button>
      <button id="bRasp"><svg class="i" width="22" height="22" viewBox="0 0 22 22"><g fill="#c2184a" stroke="#7d0a2c" stroke-width=".6"><circle cx="8" cy="6" r="3.3"/><circle cx="14" cy="6" r="3.3"/><circle cx="5" cy="11" r="3.3"/><circle cx="11" cy="11" r="3.3"/><circle cx="17" cy="11" r="3.3"/><circle cx="8" cy="16" r="3.3"/><circle cx="14" cy="16" r="3.3"/><circle cx="11" cy="20" r="3.3"/></g></svg>Raspberry</button>

      <button id="bBanana"><span class="i">🍌</span>Banana</button>
      <button id="bPecan"><span class="i">🥜</span>Pecans</button>
      <button id="bChips"><span class="i">🟤</span>Choc chips</button>

<div id="ghost" hidden></div>
<div id="pourTag" hidden></div>
<div id="flash"></div>
<div id="toast"></div>
<div id="modal" hidden><div class="card" id="modalCard"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- helpers ---------- */
const R = 1, T = 0.2, RX = 0.09, DOME = 0.035, PLATE_TOP = 0.062, MAX = 12;
const $ = id => document.getElementById(id);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

function makeNoise(seed) {
  let s = seed >>> 0 || 1;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const perm = [...Array(256).keys()];

const PAN = new THREE.Vector3(-3.75, 0, 0.45), PAN_TOP = 0.05;
function buildPan() {
  const g = new THREE.Group();

  g.add(new THREE.Mesh(lathe([[0, 0.002], [1.21, 0.002], [1.28, 0.06], [1.3, 0.2], [1.27, 0.215], [1.23, 0.19], [1.19, 0.07], [1.14, PAN_TOP], [0, PAN_TOP]], 96), iron));
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.07, 0.17), iron); arm.position.set(-1.75, 0.17, 0); g.add(arm);
  const grip = new THREE.Mesh(new RoundedBoxGeometry(0.75, 0.13, 0.22, 2, 0.05), new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.6 }));
  grip.position.set(-2.5, 0.19, 0); g.add(grip);

}
const cook = { P: null, stage: 'idle', c1: 0, c2: 0, cap: null, tex: null, ctx: null, bubbles: [], redraw: 0, smoke: 0, k: null };
function makeCapTexture() {

  cook.tex = new THREE.CanvasTexture(c); cook.tex.colorSpace = THREE.SRGBColorSpace;
}
function drawCap() {
  const x = cook.ctx, set = smooth(1, 8, cook.c1);

  g.addColorStop(0, '#f4e2b4'); g.addColorStop(0.75, lerpCol('#f1dcaa', '#e9cd93', set)); g.addColorStop(1, lerpCol('#eed4a0', '#d9b072', set));
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  for (const b of cook.bubbles) {
    const age = cook.c1 - b.t;
    if (age < 0) continue;
    if (age < 0.5) { x.fillStyle = 'rgba(255,248,226,0.9)'; x.beginPath(); x.arc(b.x, b.y, b.r * (0.5 + age), 0, 7); x.fill(); x.strokeStyle = 'rgba(190,150,90,.5)'; x.lineWidth = 1; x.stroke(); }
    else { x.fillStyle = 'rgba(170,120,60,0.55)'; x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.fill(); x.fillStyle = 'rgba(120,80,35,0.6)'; x.beginPath(); x.arc(b.x, b.y, b.r * 0.55, 0, 7); x.fill(); }

}

}

function startCooking(k) {

  P.group.scale.set(0.2, 0.35, 0.2);

  if (!cook.tex) makeCapTexture();
  cook.bubbles = []; cook.c1 = 0; cook.c2 = 0; cook.redraw = 0;
  for (let i = 0; i < 70; i++) { const r = Math.sqrt(Math.random()) * 104, a = rand(0, 6.28); cook.bubbles.push({ x: 128 + r * Math.cos(a), y: 128 + r * Math.sin(a), r: rand(2, 5.5), t: 1.6 + Math.pow(Math.random(), 0.7) * 4.6 }); }
  drawCap();

  B.geo = blobGeometry(); updateBlob(B);

  for (let i = 0; i < pos.count; i++) { uv[i * 2] = pos.getX(i) / (2 * P.size) + 0.5; uv[i * 2 + 1] = pos.getZ(i) / (2 * P.size) + 0.5; }

}
function flipPancake() {

  });

}

  }

const COOK_SPEED = 1.9;
function updateCook(dt) {

/* ---------- drag toppings onto the stack ---------- */
let aim = null, dragBtn = null, suppressClick = false;
function aimAt(px, py) {
  const P = topP(); if (!P) return null;
  raycaster.setFromCamera(new THREE.Vector2(px / innerWidth * 2 - 1, -(py / innerHeight) * 2 + 1), camera);
  const hit = raycaster.intersectObject(P.group, true)[0];
  if (!hit) return null;
  const v = P.group.worldToLocal(hit.point.clone()), r = Math.hypot(v.x, v.z), max = 0.8 * P.size;
  return r > max ? [v.x / r * max, v.z / r * max] : [v.x, v.z];
}
function wireDrag(btn) {
  btn.addEventListener('pointerdown', e => { dragBtn = { btn, sx: e.clientX, sy: e.clientY, on: false, id: e.pointerId }; });
  btn.addEventListener('pointermove', e => {
    if (!dragBtn || dragBtn.btn !== btn) return;
    const dx = e.clientX - dragBtn.sx, dy = e.clientY - dragBtn.sy;
    if (!dragBtn.on && dy < -14 && Math.abs(dy) > Math.abs(dx) && !btn.disabled && !btn.classList.contains('locked')) {
      dragBtn.on = true; btn.setPointerCapture(e.pointerId);
      $('ghost').innerHTML = btn.querySelector('.i').outerHTML; $('ghost').hidden = false;
    }
    if (dragBtn.on) { $('ghost').style.left = e.clientX + 'px'; $('ghost').style.top = (e.clientY - 30) + 'px'; }
  });
  const end = e => {
    if (!dragBtn || dragBtn.btn !== btn) return;
    if (dragBtn.on) {
      $('ghost').hidden = true;
      const a = aimAt(e.clientX, e.clientY - 30);
      if (a) { aim = a; btn.onclick(); aim = null; } else toast('Drop it onto the pancakes! 🥞', 1400);
      suppressClick = true; setTimeout(() => suppressClick = false, 60);
    }
    dragBtn = null;
  };
  btn.addEventListener('pointerup', end); btn.addEventListener('pointercancel', () => { $('ghost').hidden = true; dragBtn = null; });
}

/* ---------- slow-motion swoop for perfect plates ---------- */
let timeScale = 1, swoop = null;
function startSwoop() {
  const t = controls.target, dx = camera.position.x - t.x, dz = camera.position.z - t.z;
  swoop = { t: 0, dur: 2.0, a0: Math.atan2(dx, dz), R: Math.hypot(dx, dz), y: camera.position.y };
  timeScale = 0.3; controls.enabled = false;
  burst('✨', new THREE.Vector3(0, stackTop() + 0.3, 0), 10, { size: 0.4 });
}
function updateSwoop(rdt) {
  if (!swoop) return false;
  swoop.t += rdt;
  const k = smooth(0, 1, swoop.t / swoop.dur), t = controls.target;
  const a = swoop.a0 + k * 1.9, R = swoop.R * (1 - 0.3 * Math.sin(k * Math.PI)), y = lerp(swoop.y, t.y + 1.4, Math.sin(k * Math.PI) * 0.6);

  return true;
}

      save();
    } else {
      const nid = 'w' + Date.now();
      worlds.list[nid] = { name, created: Date.now(), data: Object.assign(DEFAULTS(), { wall: 'wall-' + theme }) };
      switchWorld(nid);
    }
    Sound.sfx('ding'); showWorlds();
  };
  $('wSave').onclick = submit;
  $('wName').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  if (!w) setTimeout(() => $('wName').focus(), 50);
}

/* ---------- start menu ---------- */
function showStart() {
  const resume = game.n > 0 && game.n < ORDERS_PER_DAY;
  let mode = game.mode, diff = game.diff, party = game.freeHoliday || 'auto';
  $('modalCard').innerHTML = `<div class="big">🥞☕</div><h2>NOVAR’s Pancake Factory</h2>
    <button class="worldbtn" id="stWorld">🌍 <b>${esc(curWorld().name)}</b> <span>· change</span></button>
    <div class="seg" id="modeSeg"><button data-m="shift">☕ Café shift</button><button data-m="free">🎨 Free play</button></div>
    <p id="startInfo"></p>
    <div id="partyBox"><p class="lbl">Party theme</p><div class="seg wrap" id="partySeg">${['auto', 'off', ...HOLIDAY_CYCLE].map(k => `<button data-h="${k}" title="${k in HOLIDAYS ? HOLIDAYS[k].name : k}">${k === 'auto' ? '📅 Auto' : k === 'off' ? 'Off' : HOLIDAYS[k].emoji}</button>`).join('')}</div></div>
    <p style="margin-top:2px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button class="worldbtn" id="stHelp" style="margin:0">❓ How to play</button><button class="worldbtn" id="stStickers" style="margin:0">📒 Stickers <span>${STICKERS.filter(x => (game.stickers || {})[x[0]]).length}/${STICKERS.length}</span></button></p>
    <div class="row"><button class="primary" id="stGo"></button></div>`;
  const paint = () => {
    for (const b of $('modalCard').querySelectorAll('[data-m]')) b.classList.toggle('sel', b.dataset.m === mode);
    for (const b of $('modalCard').querySelectorAll('[data-h]')) b.classList.toggle('sel', b.dataset.h === party);
    $('partyBox').hidden = mode !== 'free';
    const dayH = calendarHoliday() || (game.day % 4 === 0 ? HOLIDAY_CYCLE[(game.day / 4 - 1) % HOLIDAY_CYCLE.length] : null);
    const hLine = dayH ? `${HOLIDAYS[dayH].emoji} <b>Today is ${HOLIDAYS[dayH].name} at the factory!</b><br>` : `<small>🎉 Next holiday party: Day ${nextPartyDay()}</small><br>`;
    $('startInfo').innerHTML = mode === 'shift'
      ? `${resume ? `Welcome back! Day ${game.day}, order ${game.n + 1} of ${ORDERS_PER_DAY}.` : `Day ${game.day}: ${ORDERS_PER_DAY} hungry customers are coming.`}<br>${hLine}Customers wait as long as you need. Cook each pancake on the griddle, add exactly what they ask for, then tap <b>Serve</b>.<br><small>🏆 Best day: ⭐ ${game.best.stars}/${ORDERS_PER_DAY * 3} · $${game.best.tips} · 💰 All-time tips: $${game.bank}</small>`
      : 'No customers, no clock, everything unlocked. Just build the stack of your dreams.';
    $('stGo').textContent = mode === 'shift' ? (resume ? 'Back to work' : 'Open the factory') : 'Start building';
  };
  for (const b of $('modalCard').querySelectorAll('[data-m]')) b.onclick = () => { mode = b.dataset.m; paint(); };
  for (const b of $('modalCard').querySelectorAll('[data-h]')) b.onclick = () => { party = b.dataset.h; paint(); };
  $('stStickers').onclick = () => { game.mode = mode; game.freeHoliday = party; save(); showStickers(showStart); };
  $('stHelp').onclick = () => { game.mode = mode; game.diff = diff; save(); showHelp(); $('hDone').onclick = showStart; };
  $('stWorld').onclick = () => { game.mode = mode; game.diff = diff; save(); showWorlds(); };
  $('stGo').onclick = () => {
    $('modal').hidden = true;
    const switched = mode !== game.mode || !game.started;
    game.mode = mode; game.diff = diff; game.freeHoliday = party; save();
    if (musicWanted && !Sound.on) { Sound.start(); syncMusicBtn(); }
    if (switched) {
      cancelCook(); clearPlate(); game.order = null; $('ticket').hidden = true; cust.state = 'away';
      game.started = true;
      if (mode === 'shift') { if (game.n === 0 || game.n >= ORDERS_PER_DAY) { if (game.n >= ORDERS_PER_DAY) game.day++; startDay(); } else newOrder(); }
    }
    applyHoliday(); applyLocks(); refreshUI(); checkStickers();
  };
  paint();
  $('modal').hidden = false;
}

/* ---------- UI ---------- */
const BTN_KEY = { bButter: 'butter', bBerries: 'blueberry', bRasp: 'raspberry', bStraw: 'strawberry', bBanana: 'banana', bPecan: 'pecans', bChips: 'chips', bSprinkle: 'sprinkles', bMint: 'mint', bSugar: 'sugar', bChoc: 'choc', bCaramel: 'caramel', bCream: 'cream' };
function applyLocks() {
  for (const [id, key] of Object.entries(BTN_KEY)) $(id).classList.toggle('locked', !unlocked(key));
  for (const b of document.querySelectorAll('[data-syrup]')) b.classList.toggle('locked', !unlocked(b.dataset.syrup));
  for (const b of document.querySelectorAll('[data-type]')) { const k = b.dataset.type; b.hidden = !!TYPES[k].holiday && !typeUnlocked(k); b.classList.toggle('locked', !typeUnlocked(k)); b.classList.toggle('party', !!TYPES[k].holiday); }
}
function lockedToast(key) {
  const s = SHOP.find(x => x.id === key);
  toast(`🔒 ${TOPPINGS[key][1]} is locked.<br>Buy it in the 🛒 shop for $${s ? s.price : '?'}.`, 2200);
}
function refreshUI() {
  const P = topP(), shift = game.mode === 'shift';
  $('status').textContent = shift
    ? `Day ${game.day} · ${Math.min(game.n + (game.order ? 1 : 0), ORDERS_PER_DAY)}/${ORDERS_PER_DAY} · $${game.tips} tips${game.special ? ` · Special: ${TOPPINGS[game.special][0]}` : ''}`
    : 'Free play · build anything';
  for (const b of document.querySelectorAll('#panelPancakes button')) {
    const ready = shift && game.order && game.order.cooked[b.dataset.type];
    b.classList.toggle('ready', !!ready);
    b.disabled = pancakes.length >= MAX || game.busy || (shift && !!cook.P && !ready);
  }
  $('bButter').disabled = !P || !!P.butter;
  for (const b of document.querySelectorAll('[data-syrup]')) { const S = P && P.syrups.find(x => x.kind === b.dataset.syrup); b.disabled = !P || (S ? S.pours >= 4 : P.syrups.length >= 3); }
  const full = !P || P.items.length >= 70;
  for (const id of ['bBerries', 'bRasp', 'bStraw', 'bBanana', 'bChips', 'bPecan']) $(id).disabled = full;
  $('bMint').disabled = full || P.mint >= 3;
  $('bChoc').disabled = !P || P.choc >= 3;
  $('bCaramel').disabled = !P || P.caramel >= 3;
  $('bSprinkle').disabled = !P || P.sprinkles >= 4;
  $('bCream').disabled = full || P.creams >= 3;
  $('bSugar').disabled = !P || P.sugarCount >= 4;
  if (!shift) $('ticket').hidden = true;
  renderTicket();
}
$('panelPancakes').innerHTML = Object.entries(TYPES).map(([k, t]) => `<button data-type="${k}"><span class="i">${t.emoji}</span>${t.name}</button>`).join('');
for (const b of document.querySelectorAll('#panelPancakes button')) b.onclick = () => {
  const k = b.dataset.type;
  if (!typeUnlocked(k)) { toast(`🔒 ${TYPES[k].name} pancakes unlock on day ${TYPE_DAY[k]}.`, 2000); return; }
  const done = game.mode === 'shift' && game.order && game.order.cooked[k];
  if (done) {
    // already cooked one of these this order: serve a matching one straight off the griddle
    if (game.busy || pancakes.length >= MAX) return;
    const P = makePancake(k); P.cook = done.cook; P.tint = done.tint;
    P.mesh.material.color.multiply(new THREE.Color(...done.tint));
    P.group.position.set(PAN.x, PAN_TOP, PAN.z); P.group.rotation.y = rand(0, 6.28); scene.add(P.group);
    addPancake(k, P);
  } else if (game.mode === 'shift') startCooking(k); else addPancake(k);
};
for (const tab of document.querySelectorAll('.tab')) tab.onclick = () => {
  for (const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t === tab);
  for (const [k, id] of [['pancakes', 'panelPancakes'], ['syrups', 'panelSyrups'], ['toppings', 'panelToppings']]) $(id).hidden = tab.dataset.tab !== k;
  $('barwrap').scrollLeft = 0;
};
const guard = (key, fn) => () => {
  if (suppressClick) return;
  if (game.busy) return;
  if (!unlocked(key)) { lockedToast(key); return; }
  if (!topP()) { toast(game.mode === 'shift' ? 'Cook a pancake first! 🍳' : 'Add a pancake first! 🥞', 1600); return; }
  fn();
  stat(s => addTo(s.tops, key));
};
const topping = (key, fn) => guard(key, () => { curHand = ++handSeq; fn(); Sound.sfx('pop'); refreshUI(); });
$('bButter').onclick = guard('butter', () => addButter());
// syrup: press and hold to pour, let go to stop (one pour per second held)
let pouring = null;
const POUR_EVERY = () => has('fastpour') ? 0.6 : 1.0;
function pourCount() { const P = topP(), S = P && pouring && P.syrups.find(x => x.kind === pouring.kind); return S ? S.pours : 0; }
function pourOnce(kind) {
  const P = topP(), S = P && P.syrups.find(x => x.kind === kind);
  if (!P || (S ? S.pours >= 4 : P.syrups.length >= 3)) return false;
  pourSyrup(kind); Sound.sfx('pour'); stat(s => addTo(s.syrups, kind)); return true;
}
function startPour(b) {
  const kind = b.dataset.syrup;
  if (game.busy || b.disabled) return;
  if (!topP()) { toast(game.mode === 'shift' ? 'Cook a pancake first! 🍳' : 'Add a pancake first! 🥞', 1600); return; }
  if (!pourOnce(kind)) return;
  pouring = { kind, b, start: performance.now(), done: 1 }; b.classList.add('pouring');
  showPourTag();
}
function stopPour() {
  if (!pouring) return;
  const P = topP(), S = P && P.syrups.find(x => x.kind === pouring.kind);
  if (S) S.pour = Math.min(S.pour, 0.15);
  pouring.b.classList.remove('pouring'); pouring = null;
  $('pourTag').hidden = true; refreshUI();
}
function showPourTag() {
  const n = pourCount(), t = $('pourTag');
  t.hidden = false; t.textContent = `${TOPPINGS[pouring.kind][0]} Pouring ${SYRUPS[pouring.kind].name}… ${n} pour${n === 1 ? '' : 's'}`;
}
function updatePour(dt) {
  if (!pouring) return;
  const P = topP(), S = P && P.syrups.find(x => x.kind === pouring.kind);
  if (S) S.pour = Math.max(S.pour, 0.3);
  // count pours by real time held, so slow devices pour at the same rate
  const due = 1 + Math.floor((performance.now() - pouring.start) / 1000 / POUR_EVERY());
  while (pouring && pouring.done < due) {
    if (!pourOnce(pouring.kind)) { stopPour(); return; }
    pouring.done++;
  }
  showPourTag();
}
for (const b of document.querySelectorAll('[data-syrup]')) {
  let pend = null;
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('pointerdown', e => {
    pend = { x: e.clientX, y: e.clientY, id: e.pointerId, timer: setTimeout(() => { if (pend) { b.setPointerCapture(pend.id); startPour(b); pend = null; } }, 110) };
  });
  b.addEventListener('pointermove', e => { if (pend && Math.hypot(e.clientX - pend.x, e.clientY - pend.y) > 8) { clearTimeout(pend.timer); pend = null; } });
  const up = () => { if (pend) { clearTimeout(pend.timer); pend = null; startPour(b); } stopPour(); };
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', () => { if (pend) { clearTimeout(pend.timer); pend = null; } stopPour(); });
  b.addEventListener('lostpointercapture', () => stopPour());
}
$('bBerries').onclick = topping('blueberry', addBerries);
$('bStraw').onclick = topping('strawberry', addStrawberries);
$('bBanana').onclick = topping('banana', addBananas);
$('bCream').onclick = topping('cream', addCream);
$('bChips').onclick = topping('chips', addChips);
$('bSugar').onclick = topping('sugar', addSugar);
$('bChoc').onclick = topping('choc', () => addDrizzle(chocMat, 'choc', 'chocolate sauce'));
$('bCaramel').onclick = topping('caramel', () => addDrizzle(caramelMat, 'caramel', 'caramel sauce'));
$('bRasp').onclick = topping('raspberry', addRaspberries);
$('bPecan').onclick = topping('pecans', addPecans);
$('bMint').onclick = topping('mint', addMint);
$('bSprinkle').onclick = topping('sprinkles', addSprinkles);
for (const b of document.querySelectorAll('#panelToppings button')) wireDrag(b);
// the pointer events above swallow nothing, so plain taps still reach onclick
$('bServe').onclick = serve;
$('bFlip').onclick = () => { if (cook.stage === 'side1') flipPancake(); else if (cook.stage === 'side2') platePancake(); };
$('bClear').onclick = () => { if (!game.busy && pancakes.length) showModal('<h2>Start this plate over?</h2><p>Everything on the plate will be cleared.</p>', [{ label: 'Keep it', act: () => {} }, { label: 'Clear plate', cls: 'danger', act: () => { clearPlate(); Sound.sfx('trash'); } }]); };
$('bPhoto').onclick = takePhoto;
$('bMenu').onclick = () => showStart();
$('bHelp').onclick = showHelp;
$('bDonate').onclick = showDonate;
let musicWanted = true;
const syncMusicBtn = () => { $('bMusic').classList.toggle('on', Sound.on); $('bMusic').querySelector('.i').textContent = Sound.on ? '🎵' : '🔇'; };
$('bMusic').onclick = () => { if (Sound.on) Sound.stop(); else Sound.start(); musicWanted = Sound.on; syncMusicBtn(); };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const tgt = new THREE.Vector3();
function frame() {
  const rdt = Math.min(clock.getDelta(), 0.05), dt = rdt * timeScale;
  const due = []; timers = timers.filter(t => { t.t -= rdt; if (t.t <= 0) { due.push(t.fn); return false; } return true; }); due.forEach(f => f());
  for (let i = anims.length - 1; i >= 0; i--) if (anims[i](dt) === false) anims.splice(i, 1);
  for (const P of pancakes) {
    for (const S of P.syrups) updateSyrup(S, dt);
    if (P.butter) updateButter(P, P.butter, dt);
    updateItems(P.items, dt);
    if (P.sugar.length) updateSugar(P, dt);
    for (const f of P.fx) if (!f.done) f.done = !f.update(dt);
  }
  updateBerries(looseBerries, dt);
  updateCook(dt);
  updatePour(rdt);
  updateSteam(dt);
  updateFloaties(dt);
  updateHoliday(rdt);
  updatePatience(rdt);
  // look at the griddle while cooking, otherwise at the stack
  const cooking = cook.P && cook.stage !== 'idle';
  tgt.set(cooking ? PAN.x * 0.8 : 0, cooking ? 0.35 : Math.max(0.35, stackTop() * 0.55), cooking ? PAN.z * 0.8 : 0);
  controls.target.lerp(tgt, Math.min(1, rdt * 2.2));
  if (!updateSwoop(rdt)) controls.update();
  updateCustomer(rdt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

setTimeout(() => {
  getTex('buttermilk');
  buildRoom(); buildPan(); buildFruit(); buildMint(); makeCustomer();
  applyLook(); applyLocks();
  refreshUI();
  frame();
  $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 800);
  showStart();
  // bake the other pancake textures quietly in the background
  const q = Object.keys(TYPES).filter(k => !texCache[k]);
  const bake = () => { const k = q.shift(); if (k) { getTex(k); setTimeout(bake, 150); } };
  setTimeout(bake, 1500);
}, 60);
</script>
